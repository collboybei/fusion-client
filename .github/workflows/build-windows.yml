
name: Build Fusion Client for Windows

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Download source
        uses: actions/checkout@v4

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore packages
        run: dotnet restore "FusionClient/FusionClient.csproj"

      - name: Publish EXE
        shell: pwsh
        run: |
          dotnet publish "FusionClient/FusionClient.csproj" `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            --output "publish"

          Copy-Item "publish/Fusion Client.exe" "publish/FusionClient.exe"

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: FusionClient-Windows-x64
          path: publish/FusionClient.exe
          if-no-files-found: error

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: publish/FusionClient.exe
